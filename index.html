<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Kelas Madin</title>

<!-- PWA: agar bisa di-install dan dibuka layar penuh tanpa bilah browser -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F4A3C">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelas Madin">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/quran-madina-html/dist/quran-madina-html.min.js" data-cdn="vendor/quran-madina-html/" data-font="Hafs" data-font-size="16"></script>
</head>
<body>
<div id="app">
  <div class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">🕌</div>
        <div class="brand-text">
          <h1>Kelas Madin</h1>
          <p>Belajar • Beramal • Jadi Anak Sholeh</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="poin-badge">
          <span style="font-size:15px;">⭐</span>
          <div><span class="lbl">Poin Kelas</span><span class="num" id="kelasPoinNum">0</span></div>
        </div>
        <button class="gear-btn" id="installBtn" style="display:none;" title="Pasang aplikasi">⬇️</button>
        <button class="gear-btn" id="gearBtn">⚙️</button>
      </div>
    </div>
    <div class="greeting-card">
      <span class="flower">🌸</span>
      <div><b>Assalamu'alaikum,</b><span id="greetSub">semangat belajar hari ini! ✨</span></div>
    </div>
  </div>

  <div class="screen" id="screen"></div>

  <div class="bottom-nav">
    <button class="nav-btn" data-tab="beranda"><span class="ic">🏠</span><span class="t">Beranda</span></button>
    <button class="nav-btn" data-tab="materi"><span class="ic">📖</span><span class="t">Materi</span></button>
    <button class="nav-btn" data-tab="peringkat"><span class="ic">🏆</span><span class="t">Peringkat</span></button>
    <button class="nav-btn" data-tab="profil"><span class="ic">👤</span><span class="t">Profil</span></button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="celebRoot"></div>
<div id="toastRoot"></div>

<script src="app.js"></script>
</body>
</html>
